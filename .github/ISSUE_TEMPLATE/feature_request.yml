name: Improvement request
description: Suggest a service-page workflow, guardrail, example, or usability improvement.
title: "[Improvement]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the business-owner use case or current failure mode.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain the behavior or documentation change you recommend.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private client, customer, credential, and account information.
          required: true
